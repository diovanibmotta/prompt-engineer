    - input: "Carrinho permite finalizar compra mesmo com produto fora de estoque."
      output: "Como o sistema de e-commerce, eu quero validar disponibilidade de estoque antes de permitir finalização de compra, para que não sejam criados pedidos que não podem ser atendidos.\n\nCritérios de Aceitação:\n- Dado que um produto está no carrinho\n- Quando o cliente tenta finalizar a compra\n- Então o sistema deve validar estoque disponível em tempo real\n- E se o produto estiver fora de estoque, deve bloquear a compra\n\nCritérios de Prevenção:\n- Quando produto ficar sem estoque\n- E houver itens em carrinhos de outros clientes\n- Então deve exibir aviso \"estoque limitado\" ao adicionar\n- E deve reservar estoque temporariamente (15 minutos) ao ir para checkout\n\nContexto do Bug:\n- Problema: validação de estoque não é feita no checkout\n- Impacto: pedidos criados sem possibilidade de atendimento\n- Cenário crítico: múltiplos clientes comprando último item"
      complexity: "medium"

    - input: "Sistema de checkout com múltiplas falhas críticas: XSS no cupom, gateway timeout 504, race condition em cupons, loading infinito. 150+ clientes afetados, R$ 15.000 em perdas."
      output: "Como um cliente finalizando minha compra, eu quero um processo de checkout seguro, confiável e com feedback claro, para que eu possa completar minhas compras sem preocupações ou frustrações.\n\n=== USER STORY PRINCIPAL ===\n\nTítulo: Checkout seguro e confiável com tratamento robusto de erros\n\nDescrição:\nComo um cliente do e-commerce, eu quero finalizar minhas compras de forma segura, para que eu tenha confiança no processo.\n\n=== CRITÉRIOS DE ACEITAÇÃO ===\n\nA. Segurança - Proteção contra XSS:\n- Dado que estou inserindo um cupom\n- Quando digito qualquer texto\n- Então o sistema deve sanitizar a entrada\n- E não deve executar scripts maliciosos\n\nB. Integração - Processamento confiável:\n- Dado que estou finalizando uma compra\n- Quando clico em \"Finalizar Pagamento\"\n- Então o sistema deve processar em até 30 segundos\n- E não deve cobrar o cliente múltiplas vezes\n\n=== CRITÉRIOS TÉCNICOS ===\n\nSegurança:\n- Implementar sanitização de input\n- Validar no backend (defesa em profundidade)\n\n=== CONTEXTO DO BUG ===\n\nSeveridade: CRÍTICA\nImpacto: 150+ clientes, R$ 15.000 em perdas\n\n=== TASKS TÉCNICAS SUGERIDAS ===\n\n1. [SEGURANÇA] Implementar sanitização no campo cupom\n2. [BACKEND] Adicionar retry pattern no payment service"
      complexity: "complex"
